<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA redirect trick
      // Encodes the path into the query string so index.html can read it
      var loc = window.location;
      var path = loc.pathname + loc.search + loc.hash;
      window.location.replace(
        loc.origin + '/?p=' + encodeURIComponent(path)
      );
    </script>
  </head>
  <body></body>
</html>
